name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Windows PowerShell 5.1 / PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Kullanicilarin calistirdigi surum
      - name: Birim testleri (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/PC-Driver-Check.Tests.ps1

      - name: Birim testleri (PowerShell 7)
        shell: pwsh
        run: ./tests/PC-Driver-Check.Tests.ps1

      # Hata/uyari varsa adim basarisiz olur (kurallar: PSScriptAnalyzerSettings.psd1)
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize | Out-String -Width 200
          if ($r) { exit 1 }
